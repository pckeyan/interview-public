server.port=8080

spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

app.data-dir=data
app.max-upload-size=104857600

# Global request rate limit (leaky bucket) applied to /api/*
app.rate-limit.enabled=true
app.rate-limit.requests=10
app.rate-limit.period=1m
# app.rate-limit.capacity defaults to app.rate-limit.requests; set to 1 for no bursting
